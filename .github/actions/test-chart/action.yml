name: Test Helm Chart
description: Test the chart is installable
inputs:
  chart:
    required: true
runs:
  using: "composite"
  steps:
    - name: Test chart
      shell: bash
      run: ./hack/tool.sh helm install -n daemonjob-system --create-namespace my-daemonjob $chart --wait --timeout=5m
      env:
        chart: ${{ inputs.chart }}
    - name: Apply samples
      shell: bash
      run: ./hack/tool.sh kubectl apply -k config/samples
    - name: Wait until the DaemonJob is complete
      shell: bash
      run: ./hack/tool.sh kubectl wait --for=jsonpath='{.status.state}'=Complete daemonjob daemonjob-sample
