name: Lint

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 30
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Init
        uses: $/.github/actions/setup-init
      - name: Setup go
        uses: berquerant/reusable-workflows/actions/setup-go@v0.10.1
      - name: Run linters
        run: make lint

  actions-lock-verify:
    permissions:
      contents: read
    uses: berquerant/reusable-workflows/.github/workflows/actions-lock-verify.yml@v0.1.0
