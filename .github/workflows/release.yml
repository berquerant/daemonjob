name: Release

permissions: {}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFIG: "${{ github.workspace }}/tmp/.kubeconfig"
  CHART: "./charts/daemonjob"

jobs:
  publish:
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 30
    permissions:
      packages: write # for ghcr
      contents: read
      id-token: write # needed for signing the images with GitHub OIDC Token
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Init
        uses: ./.github/actions/setup-init
      - name: Set version
        id: version
        run: |
          echo "version=$(./hack/version.sh)" >> $GITHUB_OUTPUT
      - name: Setup go
        uses: ./.github/actions/setup-go
        with:
          cache: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Login to ghcr
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup buildx
        uses: ./.github/actions/setup-buildx
      - name: Check prerelease
        id: check
        run: |
          if echo "$ref" | grep -q -E '^v[0-9]+\.[0-9]+\.[0-9]+$' ; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          ref: ${{ github.ref_name }}
      - name: Build and push
        uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7.1.0
        id: build-and-push
        with:
          push: true
          sbom: true
          provenance: true
          set: |
            --no-cache
          vars: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_TAG=${{ steps.version.outputs.version }}
      - name: Sign the images with GitHub OIDC Token
        env:
          METADATA: ${{ steps.build-and-push.outputs.metadata }}
        run: |
          set -eo pipefail
          images="$(mktemp)"
          echo "$METADATA" |\
            jq 'to_entries[].value | [.["image.name"], .["containerimage.digest"]] | join("@")' -r |\
            xargs > "$images"
          cosign sign --yes "$(cat "$images")"

  test-manifest:
    needs:
      - publish
    timeout-minutes: 30
    permissions:
      contents: read
    name: Test manifest
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test installer
        uses: ./.github/actions/test-installer
        with:
          build-images: false
          cache-go: false

  test-chart:
    needs:
      - publish
    timeout-minutes: 30
    permissions:
      contents: read
    name: Test manifest
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test installer
        uses: ./.github/actions/test-installer
        with:
          build-images: false
          cache-go: false
          chart: ${{ env.CHART }}

  release:
    needs:
      - publish
      - test-manifest
      - test-chart
    timeout-minutes: 30
    permissions:
      packages: write # for ghcr
      contents: write # for github release
    name: Release
    runs-on: ubuntu-latest
    env:
      PACKAGE: tmp/package
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - name: Init
        uses: ./.github/actions/setup-init
      - name: Package the chart
        run: ./hack/tool.sh helm package --destination "$PACKAGE" "$CHART"
      - name: Login to ghcr
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push chart
        id: push-chart
        env:
          package_file: "${PACKAGE}/daemonjob-${{ needs.publish.outputs.version }}.tgz"
          remote: oci://ghcr.io/berquerant/daemonjob/charts/daemonjob
        run: |
          ./hack/tool.sh helm push "$package_file" "$remote"
          echo "package_file=${package_file}" >> $GITHUB_OUTPUT
      - name: Fetch history
        run: git fetch --prune --unshallow
      - name: Create release
        run: |
          extra_args=""
          if [ "$prerelease" = "true" ] ; then
            extra_args="${extra_args} --prerelease"
          fi
          gh release create "$ref" --verify-tag --generate-notes $extra_args "$package_file" "$manifest_file"
        env:
          GH_TOKEN: ${{ github.token }}
          ref: ${{ github.ref_name }}
          prerelease: ${{ needs.publish.outputs.prerelease }}
          package_file: ${{ steps.push-chart.outputs.package_file }}
          manifest_file: manifests/install.yaml
