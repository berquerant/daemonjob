name: Release

permissions: {}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFIG: "${{ github.workspace }}/tmp/.kubeconfig"
  CHART: "./charts/daemonjob"

jobs:
  init:
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 30
    permissions:
      contents: read
    name: InitRelease
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Init
        uses: ./.github/actions/setup-init
      - name: Set version
        id: version
        run: |
          echo "version=$(./hack/version.sh)" >> $GITHUB_OUTPUT
      - name: Check prerelease
        id: check
        run: |
          if echo "$ref" | grep -q -E '^v[0-9]+\.[0-9]+\.[0-9]+$' ; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          ref: ${{ github.ref_name }}

  publish:
    needs:
      - init
    timeout-minutes: 30
    permissions:
      packages: write # for ghcr
      contents: read
      id-token: write # needed for signing the images with GitHub OIDC Token
    name: Publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Init
        uses: ./.github/actions/setup-init
      - name: Setup go
        uses: ./.github/actions/setup-go
        with:
          cache: false
      - name: Login to ghcr
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup buildx
        uses: ./.github/actions/setup-buildx
      - name: Build and push
        uses: ./.github/actions/build-and-push
        with:
          version: ${{ needs.init.outputs.version }}
          platform: ${{ matrix.platform }}

  test-installer:
    needs:
      - publish
    timeout-minutes: 30
    permissions:
      contents: read
    name: Test Installer before Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - ""
          - ${{ env.CHART }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test installer
        uses: ./.github/actions/test-installer
        with:
          build-images: false
          cache-go: false
          chart: ${{ matrix.chart }}

  release:
    needs:
      - init
      - publish
      - test-installer
    timeout-minutes: 30
    permissions:
      packages: write # for ghcr
      contents: write # for github release
    name: Release
    runs-on: ubuntu-latest
    env:
      PACKAGE: tmp/package
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - name: Init
        uses: ./.github/actions/setup-init
      - name: Package the chart
        run: ./hack/tool.sh helm package --destination "$PACKAGE" "$CHART"
      - name: Login to ghcr
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push chart
        id: push-chart
        env:
          package_file: "${PACKAGE}/daemonjob-${{ needs.init.outputs.version }}.tgz"
          remote: oci://ghcr.io/berquerant/daemonjob/charts/daemonjob
        run: |
          ./hack/tool.sh helm push "$package_file" "$remote"
          echo "package_file=${package_file}" >> $GITHUB_OUTPUT
      - name: Fetch history
        run: git fetch --prune --unshallow
      - name: Create release
        run: |
          extra_args=""
          if [ "$prerelease" = "true" ] ; then
            extra_args="${extra_args} --prerelease"
          fi
          gh release create "$ref" --verify-tag --generate-notes $extra_args "$package_file" "$manifest_file"
        env:
          GH_TOKEN: ${{ github.token }}
          ref: ${{ github.ref_name }}
          prerelease: ${{ needs.init.outputs.prerelease }}
          package_file: ${{ steps.push-chart.outputs.package_file }}
          manifest_file: manifests/install.yaml
