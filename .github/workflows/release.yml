name: Release

permissions: {}

on:
  push:
    tags:
      - 'v*'

env:
  KUBECONFIG: "${{ github.workspace }}/tmp/.kubeconfig"
  CHART: "./charts/daemonjob"

jobs:
  publish:
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 30
    permissions:
      packages: write # for ghcr
      contents: read
    name: Publish container images
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Init
        run: make init
      - name: Set version
        id: version
        run: |
          echo "version=$(./hack/version.sh)" >> $GITHUB_OUTPUT
      - name: Setup env
        uses: ./.github/actions/setup-env
      - name: Setup go
        uses: ./.github/actions/setup-go
      - name: Login to ghcr
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup buildx
        use: ./.github/actions/setup-buildx
      - name: Check prerelease
        id: check
        run: |
          if echo "$ref" | grep -q -E '^v[0-9]+\.[0-9]+\.[0-9]+$' ; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          ref: ${{ github.ref_name }}
      - name: Build and push
        uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7.1.0
        with:
          push: true
          set: |
            --no-cache
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}

  test-manifest:
    needs:
      - publish
    timeout-minutes: 30
    permissions:
      contents: read
    name: Test manifest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test installer
        uses: ./.github/actions/test-installer
        with:
          build-images: false

  test-chart:
    needs:
      - publish
    timeout-minutes: 30
    permissions:
      contents: read
    name: Test manifest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test installer
        uses: ./.github/actions/test-installer
        with:
          build-images: false
          chart: ${{ env.CHART }}

  release:
    needs:
      - test-manifest
      - test-chart
    timeout-minutes: 30
    permissions:
      packages: write # for ghcr
      contents: write # for github release
    name: Release chart
    env:
      PACKAGE: tmp/package
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - name: Init
        run: make init
      - name: Setup env
        uses: ./.github/actions/setup-env
      - name: Package the chart
        run: ./hack/tool.sh helm package --destination "$PACKAGE" "$CHART"
      - name: Login to ghcr
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push chart
        env:
          package_file: "${PACKAGE}/daemonjob-${{ needs.publish.outputs.version }}.tgz"
          remote: oci://ghcr.io/berquerant/daemonjob/charts/daemonjob
        run: |
          ./hack/tool.sh helm push $package_file $remote
          echo package_file=$package_file >> $GITHUB_ENV
      - name: Fetch history
        run: git fetch --prune --unshallow
      - name: Create release
        run: |
          extra_args=""
          if [ "$prerelease" = "true" ] ; then
            extra_args="${extra_args} --prerelease"
          fi
          gh release create "$ref" --verify-tag --generate-notes $extra_args "$package_file"
        env:
          GH_TOKEN: ${{ github.token }}
          ref: ${{ github.ref_name }}
          prerelease: ${{ needs.publish.outputs.prerelease }}
