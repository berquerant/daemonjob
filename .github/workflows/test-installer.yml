name: Installer Tests

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFIG: "${{ github.workspace }}/tmp/.kubeconfig"

jobs:
  test-installer:
    timeout-minutes: 30
    permissions:
      contents: read
    name: Test Installer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - ""
          - charts/daemonjob
    steps:
      - name: Clone the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Test installer
        uses: ./.github/actions/test-installer
        with:
          build-images: true
          load-images: true
          docker-cache-dir: ${{ env.DOCKER_CACHE_DIR }}
          chart: ${{ matrix.chart }}
