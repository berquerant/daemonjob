name: Tests

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFIG: "${{ github.workspace }}/tmp/.kubeconfig"

jobs:
  test:
    timeout-minutes: 30
    permissions:
      contents: read
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Init
        uses: $/.github/actions/setup-init
      - name: Setup go
        uses: berquerant/reusable-workflows/actions/setup-go@v0.10.1
      - name: Running Tests
        run: make test

  govulncheck:
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: berquerant/govulncheck-action@v1.0.4
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
