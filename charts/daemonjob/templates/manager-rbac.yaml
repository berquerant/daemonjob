apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "daemonjob.fullname" . }}-manager-role
  labels:
  {{- include "daemonjob.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs/status
  - jobs/status
  verbs:
  - get
  - watch
- apiGroups:
  - daemonjob.berquerant.github.io
  resources:
  - daemoncronjobs
  - daemoncronjobsets
  - daemonjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - daemonjob.berquerant.github.io
  resources:
  - daemoncronjobs/finalizers
  - daemoncronjobsets/finalizers
  - daemonjobs/finalizers
  verbs:
  - update
- apiGroups:
  - daemonjob.berquerant.github.io
  resources:
  - daemoncronjobs/status
  - daemoncronjobsets/status
  - daemonjobs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "daemonjob.fullname" . }}-manager-rolebinding
  labels:
  {{- include "daemonjob.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "daemonjob.fullname" . }}-manager-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "daemonjob.serviceAccountName" . }}'
  namespace: '{{ .Release.Namespace }}'
