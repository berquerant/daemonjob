apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "daemonjob.fullname" . }}-daemoncronjob-viewer-role
  labels:
  {{- include "daemonjob.labels" . | nindent 4 }}
rules:
- apiGroups:
  - daemonjob.berquerant.github.io
  resources:
  - daemoncronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - daemonjob.berquerant.github.io
  resources:
  - daemoncronjobs/status
  verbs:
  - get
