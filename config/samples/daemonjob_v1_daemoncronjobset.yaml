apiVersion: daemonjob.berquerant.github.io/v1
kind: DaemonCronJobSet
metadata:
  labels:
    app.kubernetes.io/name: daemonjob
    app.kubernetes.io/managed-by: kustomize
  name: daemoncronjobset-sample
spec:
  nodeSelector: {}
  cronJobTemplate:
    metadata:
      annotations:
        app: sample
      labels:
        app.kubernetes.io/name: sample
    spec:
      schedule: "* * * * *"
      jobTemplate:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: main
                  image: debian:trixie-slim
                  command:
                    - bash
                    - -c
                    - |
                      sleep 2
                      echo Done!
