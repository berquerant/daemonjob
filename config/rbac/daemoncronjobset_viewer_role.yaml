# This rule is not used by the project daemonjob itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to daemonjob.berquerant.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: daemonjob
    app.kubernetes.io/managed-by: kustomize
  name: daemoncronjobset-viewer-role
rules:
- apiGroups:
  - daemonjob.berquerant.github.io
  resources:
  - daemoncronjobsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - daemonjob.berquerant.github.io
  resources:
  - daemoncronjobsets/status
  verbs:
  - get
