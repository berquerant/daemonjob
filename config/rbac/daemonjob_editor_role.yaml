# This rule is not used by the project daemonjob itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the daemonjob.berquerant.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: daemonjob
    app.kubernetes.io/managed-by: kustomize
  name: daemonjob-editor-role
rules:
- apiGroups:
  - daemonjob.berquerant.github.io
  resources:
  - daemonjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - daemonjob.berquerant.github.io
  resources:
  - daemonjobs/status
  verbs:
  - get
